<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DefectScope - Bottle Defect Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .upload-zone {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-zone:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .upload-zone.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-zone p {
            color: #666;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .upload-zone .hint {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: #764ba2;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .result-status {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .result-status.good {
            color: #27ae60;
        }

        .result-status.defective {
            color: #e74c3c;
        }

        .result-details {
            background: white;
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DefectScope</h1>
            <p>Real-time bottle defect detection</p>
        </div>

        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📸</div>
            <p>Drop your image here or click to upload</p>
            <p class="hint">PNG, JPG up to 10MB</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <button class="button" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
            Choose Image
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 12px; color: #666;">Analyzing bottle...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <img id="resultImage" class="result-image" src="" alt="Uploaded image">
            <div class="result-status" id="resultStatus"></div>
            <div class="result-details">
                <div class="detail-row">
                    <span class="detail-label">Confidence</span>
                    <span class="detail-value" id="resultConfidence"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Processing Time</span>
                    <span class="detail-value" id="resultLatency"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                uploadImage();
            }
        });

        uploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', uploadImage);

        function uploadImage() {
            const file = fileInput.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('resultImage').src = e.target.result;
            };
            reader.readAsDataURL(file);

            // Send to backend
            const formData = new FormData();
            formData.append('file', file);

            loading.classList.add('show');
            error.classList.remove('show');
            result.classList.remove('show');

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('Prediction failed');
                return response.json();
            })
            .then(data => {
                loading.classList.remove('show');
                displayResult(data);
            })
            .catch(err => {
                loading.classList.remove('show');
                showError(err.message || 'Error processing image');
            });
        }

        function displayResult(data) {
            const status = document.getElementById('resultStatus');
            const statusText = data.prediction === 'good' ? '✓ Good' : '⚠ Defective';
            const statusClass = data.prediction === 'good' ? 'good' : 'defective';

            status.textContent = statusText;
            status.className = `result-status ${statusClass}`;

            document.getElementById('resultConfidence').textContent =
                (data.confidence * 100).toFixed(1) + '%';
            document.getElementById('resultLatency').textContent =
                data.latency_ms + ' ms';

            result.classList.add('show');
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }
    </script>
</body>
</html>
