version: "3.9"

services:
  defectscope:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory so you can swap weights without rebuilding
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
    restart: unless-stopped
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
